<section class="hero" id="hero">

  <!-- Top-right radial glow -->
  <div class="hero__glow" aria-hidden="true"></div>

  <!-- Left: animated scroll indicator -->
  <div class="hero__scroll" aria-hidden="true">
    <div class="hero__scroll-box">
      <span class="hero__scroll-dot"></span>
    </div>
    <div class="hero__scroll-line"></div>
  </div>

  <!-- Centre: main copy -->
  <div class="hero__center">
    <span class="hero__role">{{ t().hero.role }}</span>
    <h1 class="hero__name">Atahar Hossain</h1>
    <div class="hero__cta">
      <button class="hero__btn" (click)="scrollToSection('projects')">
        <span class="hero__btn-label" [attr.data-text]="t().hero.checkWork">{{
          t().hero.checkWork
        }}</span>
      </button>
      <button class="hero__btn" (click)="scrollToSection('contact')">
        <span class="hero__btn-label" [attr.data-text]="t().hero.contactMe">{{
          t().hero.contactMe
        }}</span>
      </button>
    </div>
  </div>

  <!-- Right: email + social icons -->
  <aside class="hero__right">
    <a href="mailto:shajib.ruet07@gmail.com" class="hero__email" aria-label="Email">
      shajib.ruet07&#64;gmail.com
    </a>
    <span class="hero__v-line"></span>
    <div class="hero__socials">
      <a href="https://github.com/shajib07" target="_blank" rel="noopener noreferrer"
         class="hero__social-link" aria-label="GitHub">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.08-.73.08-.73 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.11-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.13 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.22.69.83.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
      <a href="https://www.linkedin.com/in/atahar-hossain-shajib-00561962/" target="_blank" rel="noopener noreferrer"
         class="hero__social-link" [attr.aria-label]="t().footer.linkedin">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.35-1.85 3.58 0 4.24 2.36 4.24 5.43v6.31zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
        </svg>
      </a>
    </div>
    <span class="hero__line-down"></span>
  </aside>

  <!-- Bottom ticker -->
  <div class="hero__ticker" aria-hidden="true">
    <div class="hero__ticker-track">
      @for (_ of tickerRepeat; track $index) {
        <span>{{ t().hero.ticker }}</span>
      }
    </div>
  </div>

</section>
