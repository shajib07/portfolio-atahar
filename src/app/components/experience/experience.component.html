<section class="experience" id="experience">
  <div class="container">

    <h2 class="experience__title" appScrollAnimation>
      {{ t().experience.title }}
    </h2>

    <!-- Carousel -->
    <div class="experience__carousel" appScrollAnimation>
      <div class="experience__track">
        @for (item of t().experience.items; track item.author; let i = $index) {
          <div class="experience__slide" [class]="getSlideClass(i)">
            <!-- Large quote mark -->
            <span class="experience__quote" aria-hidden="true">&ldquo;&ldquo;</span>
            <p class="experience__text">{{ item.text }}</p>
            <div class="experience__author">
              <span class="experience__divider"></span>
              <span class="experience__name">{{ item.author }} – {{ item.role }}</span>
            </div>
          </div>
        }
      </div>

      <!-- Navigation -->
      <div class="experience__nav">
        <button class="experience__arrow" (click)="prev()" aria-label="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>

        <div class="experience__dots">
          @for (dot of range(itemCount); track dot) {
            <button
              class="experience__dot"
              [class.experience__dot--active]="dot === activeIndex()"
              (click)="goTo(dot)"
              [attr.aria-label]="'Go to slide ' + (dot + 1)"
            ></button>
          }
        </div>

        <button class="experience__arrow" (click)="next()" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

  </div>
</section>
