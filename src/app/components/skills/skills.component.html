<section class="skills" id="skills">
  <div class="container skills__inner">
    <!-- Left card -->
    <div class="skills__card-wrap appScrollAnimation">
      <span class="section-label">{{ t().skills.label }}</span>

      <div class="skills__card">
        <h2 class="section-title">{{ t().skills.title }}</h2>
        <p class="section-description">{{ t().skills.description }}</p>

        <div class="skills__cta-wrap">
          <h3 class="skills__cta-title">{{ t().skills.additionalTitle }}</h3>
          <p class="skills__cta-desc">{{ t().skills.additionalDescription }}</p>
        </div>

        <button class="section-btn" (click)="scrollToContact()">
          {{ t().skills.learnMore }}
        </button>
      </div>
    </div>

    <!-- Right: icon grid -->
    <div class="skills__grid" appScrollAnimation>
      @for (skill of skills; track skill.name) {
        <div class="skills__item">
          <div class="skills__icon">
            <app-tech-icon [icon]="skill.icon" />
          </div>
          <span class="skills__item-name">{{ skill.name }}</span>
        </div>
      }
    </div>
  </div>
</section>
